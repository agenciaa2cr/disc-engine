# Drop-in para o projeto `disc` já rodando na VPS (srv1929725, /root/disc-a2cr).
# Mesma convenção de rede, labels do Traefik e variáveis PG_* do compose
# original — a diferença deliberada é a AUSÊNCIA de ANTHROPIC_API_KEY:
# este serviço não faz nenhuma chamada de rede para gerar laudo.
#
# Antes de subir isto em produção:
#   1. Rotacione PG_PASSWORD (a atual está exposta no .env do projeto antigo).
#   2. Aplique db/schema.sql contra o Postgres (schema `disc`, isolado do
#      restante do Supabase).
#   3. Confirme que a rede externa `supabase_default` já existe (ela existe
#      hoje — é a mesma usada pelo Supabase self-hosted da VPS).

name: disc

services:
  disc-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disc-server
    restart: unless-stopped
    environment:
      PG_HOST: supabase-db
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DATABASE: ${PG_DATABASE:-postgres}
      PORT: "4100"
    networks:
      - disc_net
      - supabase_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=disc_disc_net"
      - "traefik.http.routers.disc.rule=Host(`disc.appbuilder.digital`)"
      - "traefik.http.routers.disc.entrypoints=websecure"
      - "traefik.http.routers.disc.tls=true"
      - "traefik.http.routers.disc.tls.certresolver=letsencrypt"
      - "traefik.http.services.disc.loadbalancer.server.port=4100"

networks:
  disc_net:
    driver: bridge
  supabase_default:
    external: true
